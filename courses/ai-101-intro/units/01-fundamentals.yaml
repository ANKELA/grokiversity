        solution: "Dots: 1, 0, 1. Scores: 1/√2, 0, 1/√2 ≈ (0.707107, 0, 0.707107). e^{1/√2}≈2.028115 twice, plus 1, sum≈5.05623. α=(0.401112, 0.197776, 0.401112). Output=0.401112·1 + 0.197776·2 + 0.401112·4=2.40111."

