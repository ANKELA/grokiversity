  - "Optional but helpful: a first calculus course (derivatives) and intro programming. Unit 4 reviews the calculus actually used."

concepts:
  # ------------------------------------------------------------------ 1
  - id: c1-what-is-ai
    title: "What AI is: agents, history, and measuring performance"
    prerequisites: []
    objectives:
      - "Define an agent, an environment and a performance measure, and distinguish rational action from mimicking humans (Turing test vs. rational-agent view)."
      - "Compute the expected utility of an action and choose the action that maximises it."
      - "Count nodes generated by uninformed search and apply Bayes' rule to a realistic diagnostic problem."
      - "Compute a majority-class baseline so that a later accuracy number has something honest to beat."
    explanation_outline:
      - "AI is the study of agents that receive percepts from an environment and take actions to do well according to a performance measure (Russell & Norvig). The Turing test asks whether a machine can imitate a human; the rational-agent view asks whether it acts so as to maximise expected performance. Those are different goals."
      - "A short history for orientation, not trivia: Turing 1950; Dartmouth 1956 (the name 'artificial intelligence'); 1960s–70s symbolic systems and the first AI winter; 1980s expert systems and a second winter; 1990s–2000s statistical machine learning; 2012 deep convolutional nets (AlexNet); 2017 transformers; 2020s large language models. Methods changed; the questions (search, uncertainty, learning, decision-making) did not."
      - "PEAS: Performance measure, Environment, Actuators, Sensors. Task environments are described as fully vs. partially observable, deterministic vs. stochastic, episodic vs. sequential, static vs. dynamic, discrete vs. continuous, single- vs. multi-agent."
      - "Rationality under uncertainty: if action a yields utility U(s) in outcome s with probability P(s|a), the expected utility is EU(a)=Σ_s P(s|a) U(s). A rational agent picks argmax_a EU(a). Utilities are not automatically money; they encode the performance measure."
      - "Search (Unit 2, first look): a problem is a state space, actions, a transition model and a goal test. In a tree with branching factor b, the number of nodes down to depth d is (b^{d+1}−1)/(b−1) if b≠1. For BFS that tests the goal when a node is generated, a worst-case goal at depth d (the last node generated there) requires generating every node of depth 0..d."
      - "Uncertainty (Unit 3, first look): Bayes' rule, P(H|E)=P(E|H)P(H)/P(E), with P(E)=P(E|H)P(H)+P(E|¬H)P(¬H). Base rates matter; a sensitive test for a rare event can still leave a low posterior."
      - "Learning (this unit, then Units 5–9): improve performance from data. Before celebrating a classifier's accuracy, compute the majority-class baseline: max class count / n. An accuracy of 75% is modest if the baseline is already 74%, and strong if the baseline is 50%."
      - "Common errors: treating the Turing test as the definition of AI; maximising the best-case outcome instead of expected utility; using O(b^d) as an exact node count; forgetting the complement term in the law of total probability; reporting accuracy without a baseline."
    explanation_prompts:
      - "Contrast a chatbot that fools a judge with a thermostat that keeps a room at 20 °C. Which is more clearly a rational agent, and why?"
      - "Walk through the disease-test calculation slowly, first computing P(+), then the posterior, and ask what happens if prevalence drops from 1% to 0.1%."
    quiz:
      - id: q1.1
        difficulty: easy
        type: numeric
        prompt: "A rational agent chooses among three actions. A: utility 10 with probability 0.7 and utility 0 with probability 0.3. B: utility 20 with probability 0.4 and utility −2 with probability 0.6. C: utility 6.5 with certainty. Compute the expected utility of A, of B, and of C."
        answers:
          - {quantity: "EU(A)", value: 7.0, unit: "1", tolerance_pct: 1}
          - {quantity: "EU(B)", value: 6.8, unit: "1", tolerance_pct: 1}
          - {quantity: "EU(C)", value: 6.5, unit: "1", tolerance_pct: 1}
        hints:
          - "EU(a) = Σ P(outcome) × utility(outcome). For C the probability is 1."
          - "For B, the second term is 0.6 × (−2), which is negative. Don't drop the sign."
        solution: "EU(A)=0.7·10+0.3·0=7. EU(B)=0.4·20+0.6·(−2)=8−1.2=6.8. EU(C)=6.5. A rational agent chooses A, the unique maximiser."
      - id: q1.2
        difficulty: medium
        type: numeric
        prompt: "Consider a complete tree with branching factor b=4 (every non-leaf has exactly 4 children). The start node is at depth 0. Breadth-first search tests the goal when a node is generated (as soon as it is created). The unique goal is the last node generated at depth 5. How many nodes does BFS generate?"
        answers:
          - {quantity: "nodes generated", value: 1365, unit: "count", tolerance_abs: 0}
        hints:
          - "Depth k contains b^k nodes. You generate every node at depths 0 through 5."
          - "The sum is (b^{d+1}−1)/(b−1) with d=5, b=4."
        solution: "Nodes at depth k: 4^k. Total = Σ_{k=0}^{5} 4^k = (4^6−1)/(4−1) = (4096−1)/3 = 1365. (If the goal test were applied only on expansion, you would also generate the children of the goal's earlier siblings at depth 6; that is a different, larger count. This problem tests on generation.)"
      - id: q1.3
        difficulty: hard
        type: numeric
        prompt: "A disease has prevalence P(D)=0.01. A test has P(+|D)=0.95 and false-positive rate P(+|¬D)=0.10. Compute the marginal probability of a positive test, P(+), and the posterior P(D|+). Report both as probabilities (unit 1), not percents."
        answers:
          - {quantity: "P(+)", value: 0.1085, unit: "1", tolerance_pct: 1}
          - {quantity: "P(D|+)", value: 0.08756, unit: "1", tolerance_pct: 1}
        hints:
          - "Law of total probability: P(+) = P(+|D)P(D) + P(+|¬D)P(¬D). What is P(¬D)?"
          - "Then Bayes: P(D|+) = P(+|D)P(D) / P(+)."
          - "The posterior should be much closer to 10% than to 95%. A rare disease plus a 10% false-positive rate floods the positives with false alarms."
        solution: "P(¬D)=0.99. P(+)=0.95·0.01 + 0.10·0.99 = 0.0095+0.0990=0.1085. P(D|+)=0.0095/0.1085=0.087557… ≈ 0.08756 (8.756%)."
      - id: q1.4
        difficulty: medium
        type: numeric
        prompt: "A data set has 120 examples of class A and 80 of class B (n=200). What is the accuracy, as a percent, of the majority-class baseline (always predict the more common class)? A model predicts 150 of the 200 labels correctly. What is its accuracy, as a percent?"
        answers:
          - {quantity: "majority baseline", value: 60, unit: "%", tolerance_abs: 0.05}
          - {quantity: "model accuracy", value: 75, unit: "%", tolerance_abs: 0.05}
        hints:
          - "The majority class is A, with 120/200 of the data."
          - "Accuracy is (number correct)/n, then convert to a percent."
        solution: "Baseline = 120/200 = 0.60 = 60%. Model accuracy = 150/200 = 0.75 = 75%. The lift is 15 percentage points, which is real but not a miracle; always publish the baseline."

  # ------------------------------------------------------------------ 2
  - id: c2-linear-models
    title: "Learning from data: linear regression and mean squared error"
    prerequisites: [c1-what-is-ai]
    objectives:
      - "Write a linear predictor ŷ = w x + b and compute its mean squared error on a finite data set."
      - "Derive the ordinary-least-squares slope and intercept in one dimension, and evaluate the resulting MSE and residuals."
      - "Fit a no-intercept model by a single projection formula, and compute the gradient of MSE with respect to w and b."
    explanation_outline:
      - "Supervised learning: a data set {(x_i, y_i)}_{i=1}^n is given, and we want a predictor ŷ(x) that will do well on new x drawn from the same process. This unit uses a single numeric input; later units add multiple features and classification."
      - "A linear model is ŷ = w x + b. The residual at point i is e_i = y_i − ŷ_i. We measure average squared residual by MSE = (1/n) Σ e_i². (Some notes use 1/(2n) to make the 2 in the derivative cancel. We do not; carry the 2 in the gradient.)"
      - "Why squares? They penalise large misses more than mean absolute error, they are differentiable, and the minimiser for a 1-D linear model has a closed form. They are also sensitive to outliers — that is a feature you must remember, not a bug you can ignore."
      - "Ordinary least squares, one feature: let x̄ and ȳ be the sample means. Then ŵ = Σ(x_i−x̄)(y_i−ȳ) / Σ(x_i−x̄)² and b̂ = ȳ − ŵ x̄. This is also the unique critical point of MSE, because MSE is a strictly convex quadratic in (w,b) whenever the x_i are not all equal."
      - "No intercept (ŷ = w x): ŵ = (Σ x_i y_i)/(Σ x_i²), the projection of y onto x. Forcing the line through the origin raises MSE unless the true intercept is actually zero."
      - "Gradient, used in Concept 3: ∂MSE/∂w = −(2/n) Σ x_i e_i and ∂MSE/∂b = −(2/n) Σ e_i, with e_i = y_i − (w x_i + b). A negative partial with respect to w means that increasing w decreases MSE, to first order."
      - "Common errors: using 1/(n−1) or 1/(2n) without saying so; swapping slope and intercept; computing ŵ with raw sums Σ x y / Σ x² when an intercept is present (that formula is for the no-intercept model only); dropping the leading 2 in the gradient."
    explanation_prompts:
      - "Have the student plot the four-point data set and guess a line before computing OLS, then compare the guessed MSE with the optimal MSE."
      - "Ask why adding an extreme point (5, 14) would move the OLS line a lot, and what that says about squared loss."
    quiz:
      - id: q2.1
        difficulty: easy
        type: numeric
        prompt: "Data: (x,y) = (1,2), (2,2), (3,5), (4,5). For the line ŷ = x + 0.5 (that is, w=1, b=0.5), compute the mean squared error MSE = (1/n) Σ (y_i−ŷ_i)²."
        answers:
          - {quantity: "MSE", value: 0.75, unit: "1", tolerance_pct: 1}
        hints:
          - "There are n=4 points. First write each ŷ_i, then each residual, then the average of the squared residuals."
          - "ŷ takes the values 1.5, 2.5, 3.5, 4.5."
        solution: "ŷ = (1.5, 2.5, 3.5, 4.5). Residuals: 0.5, −0.5, 1.5, 0.5. Squared: 0.25, 0.25, 2.25, 0.25. Sum = 3. MSE = 3/4 = 0.75."
      - id: q2.2
        difficulty: medium
        type: numeric
        prompt: "For the same four points, find the ordinary-least-squares slope w, intercept b, and the MSE of that fit."
        answers:
          - {quantity: "w", value: 1.2, unit: "1", tolerance_pct: 1}
          - {quantity: "b", value: 0.5, unit: "1", tolerance_pct: 1}
          - {quantity: "MSE", value: 0.45, unit: "1", tolerance_pct: 1}
        hints:
          - "First compute the means x̄ and ȳ. Then ŵ = Σ(x−x̄)(y−ȳ) / Σ(x−x̄)² and b̂ = ȳ − ŵ x̄."
          - "x̄ = 2.5 and ȳ = 3.5. The denominator Σ(x−x̄)² should come out to 5."
        solution: "x̄=2.5, ȳ=3.5. Σ(x−x̄)² = 2.25+0.25+0.25+2.25=5. Σ(x−x̄)(y−ȳ)=2.25+0.75+0.75+2.25=6. ŵ=6/5=1.2, b̂=3.5−1.2·2.5=0.5. Predictions (1.7, 2.9, 4.1, 5.3). Residuals (0.3, −0.9, 0.9, −0.3). SSE=1.8, MSE=0.45. (As a check, R²=1−1.8/9=0.80.)"
      - id: q2.3
        difficulty: medium
        type: numeric
        prompt: "Again on those four points, fit the no-intercept model ŷ = w x (the line is forced through the origin). Find w and the MSE."
        answers:
          - {quantity: "w", value: 1.3667, unit: "1", tolerance_pct: 1}
          - {quantity: "MSE", value: 0.49167, unit: "1", tolerance_pct: 1}
        hints:
          - "The critical point of MSE for ŷ=wx is ŵ = (Σ x_i y_i)/(Σ x_i²)."
          - "Σ x y = 1·2+2·2+3·5+4·5 and Σ x² = 1+4+9+16."
        solution: "Σxy=2+4+15+20=41, Σx²=30, ŵ=41/30=1.3666…. Predictions (1.3667, 2.7333, 4.1000, 5.4667). SSE=1.96667, MSE=1.96667/4=0.49167, which is higher than the 0.45 of the model that has an intercept, as it must be."
      - id: q2.4
        difficulty: hard
        type: numeric
        prompt: "Using MSE = (1/n) Σ (y_i − w x_i − b)² on the same four points, compute the partial derivatives ∂MSE/∂w and ∂MSE/∂b at (w,b)=(1,1)."
        answers:
          - {quantity: "∂MSE/∂w", value: -0.5, unit: "1", tolerance_abs: 0.005}
          - {quantity: "∂MSE/∂b", value: 0, unit: "1", tolerance_abs: 0.005}
        hints:
          - "The residuals at this point are e = y − (x+1). Write all four, then use ∂MSE/∂w = −(2/n) Σ x_i e_i and ∂MSE/∂b = −(2/n) Σ e_i."
          - "If you dropped the 2, or used 1/(2n) as the loss, your partials will be half as large. This course uses (1/n) Σ e²."
        solution: "ŷ=(2,3,4,5), e=(0,−1,1,0). Σ x e = 1·0+2·(−1)+3·1+4·0=1. Σ e=0. ∂MSE/∂w=−(2/4)·1=−0.5. ∂MSE/∂b=−(2/4)·0=0. (The Hessian entry ∂²MSE/∂w²=(2/n)Σx²=15, so this surface is steep in the w direction; Concept 3 will show that a careless learning rate overshoots.)"

  # ------------------------------------------------------------------ 3
  - id: c3-gradient-descent
    title: "Gradient descent"
    prerequisites: [c2-linear-models]
    objectives:
      - "Write a gradient-descent update for a differentiable loss and carry out one or two steps by hand."
      - "Compute the gradient of MSE for a linear model and take a step from a given (w,b)."
      - "Determine, for a one-dimensional quadratic, the critical learning rate at which gradient descent ceases to converge, and recognise oscillation vs. divergence."
    explanation_outline:
      - "Gradient descent minimises a differentiable loss J(θ) by walking downhill: θ ← θ − η ∇J(θ). The learning rate η>0 is a step-size, not a magic property of the data. Too small: slow. Too large: overshoot or diverge."
      - "For a 1-D quadratic J(w)=(w−3)² we have J'(w)=2(w−3), so the update is w ← w − 2η(w−3) = (1−2η)w + 6η. This is a linear recurrence. It converges to 3 if and only if |1−2η|<1, i.e. 0<η<1. At η=1 the iterate oscillates (w and 6−w swap). For η>1 it diverges."
      - "For linear regression, J(w,b)=MSE, with the partials from Concept 2. One step from (w,b) with learning rate η is w ← w − η ∂J/∂w, b ← b − η ∂J/∂b."
      - "A first-order (gradient) prediction of the new loss can be wrong when η is large, because the second-order term (1/2) η² vᵀ H v can dominate. In this course's four-point example, ∂²J/∂w²=15, so even a modest η can increase J on that step. Always compute the new loss; don't assume it fell."
      - "In later units: local minima and saddles in deep nets, stochastic / mini-batch gradient descent, and adaptive methods (Adam). The definition does not change."
      - "Common errors: adding η ∇J instead of subtracting it; using the 1/(2n) gradient with a (1/n) loss (off by 2); claiming GD always decreases J; treating η=1 as 'unit step' without checking the Lipschitz / curvature scale."
    explanation_prompts:
      - "Have the student predict, before running the visualiser, whether η=0.2, 0.5, 1.0 and 1.1 will converge, oscillate or diverge on J(w)=(w−3)², then check."
      - "From (w,b)=(1,1) with η=0.2 on the four-point MSE, ask them to compute the new loss and explain why it went up even though we followed the negative gradient."
    quiz:
      - id: q3.1
        difficulty: easy
        type: numeric
        prompt: "Let J(w)=(w−3)². Start at w=0 and take gradient-descent steps with η=0.2. Report w after one step and after two steps."
        answers:
          - {quantity: "w after 1 step", value: 1.2, unit: "1", tolerance_pct: 1}
          - {quantity: "w after 2 steps", value: 1.92, unit: "1", tolerance_pct: 1}
        hints:
          - "J'(w)=2(w−3). The update is w ← w − η J'(w)."
          - "After the first step you should be at 1.2. Now compute J'(1.2) and step again."
        solution: "J'(0)=2(0−3)=−6. w₁=0−0.2·(−6)=1.2. J'(1.2)=2(1.2−3)=−3.6. w₂=1.2−0.2·(−3.6)=1.2+0.72=1.92."
      - id: q3.2
        difficulty: medium
        type: numeric
        prompt: "On the four-point data of Concept 2, start at (w,b)=(0,0) and take one gradient-descent step on MSE with η=0.01. Report ∂MSE/∂w, ∂MSE/∂b at the start, then the updated w and b."
        answers:
          - {quantity: "∂MSE/∂w", value: -20.5, unit: "1", tolerance_pct: 1}
          - {quantity: "∂MSE/∂b", value: -7, unit: "1", tolerance_pct: 1}
          - {quantity: "w", value: 0.205, unit: "1", tolerance_pct: 1}
          - {quantity: "b", value: 0.07, unit: "1", tolerance_pct: 1}
        hints:
          - "At (0,0) every residual is just y_i. Use ∂MSE/∂w=−(2/n)Σ x_i y_i and ∂MSE/∂b=−(2/n)Σ y_i."
          - "Σ x y = 41 and Σ y = 14, with n=4."
        solution: "∂MSE/∂w=−(2/4)·41=−20.5, ∂MSE/∂b=−(2/4)·14=−7. Then w=0−0.01·(−20.5)=0.205, b=0−0.01·(−7)=0.07. (η=0.1 would jump to (2.05, 0.70) and overshoot the OLS point (1.2, 0.5); curvature in w is 15, so η around 1/15≈0.067 is already a full Newton step in that direction.)"
      - id: q3.3
        difficulty: hard
        type: numeric
        prompt: "Still for J(w)=(w−3)² and the update w ← w − η J'(w): (a) find the critical learning rate η_c such that the iteration diverges for every η>η_c; (b) start at w=5 with η=1 and report w after one step and after two steps."
        answers:
          - {quantity: "η_c", value: 1, unit: "1", tolerance_abs: 0.005}
          - {quantity: "w after 1 step", value: 1, unit: "1", tolerance_abs: 0.005}
          - {quantity: "w after 2 steps", value: 5, unit: "1", tolerance_abs: 0.005}
        hints:
          - "Rewrite the update as w ← (1−2η)w + 6η. This converges iff |1−2η|<1."
          - "At η=1 the map is w ← 6−w. What does that do to 5?"
        solution: "|1−2η|<1 ⇔ 0<η<1, so the iteration diverges for every η>η_c=1. At η=1, J'(5)=2(5−3)=4, w₁=5−1·4=1, J'(1)=2(1−3)=−4, w₂=1−1·(−4)=5. The iterate oscillates and never settles (unless you started at 3)."
      - id: q3.4
        difficulty: hard
        type: numeric
        prompt: "On the four-point data, start at (w,b)=(1,1) — the point from q2.4 — and take one MSE gradient step with η=0.2. Report the new w, the new b, and the MSE at the new point."
        answers:
          - {quantity: "w", value: 1.1, unit: "1", tolerance_pct: 1}
          - {quantity: "b", value: 1, unit: "1", tolerance_abs: 0.005}
          - {quantity: "MSE", value: 0.525, unit: "1", tolerance_pct: 1}
        hints:
          - "You already have the gradient: (−0.5, 0). Apply w ← w − η ∂J/∂w."
          - "Then recompute all four residuals at the new parameters and average their squares. Don't assume the loss went down."
        solution: "w=1−0.2·(−0.5)=1.1, b=1−0.2·0=1. New ŷ=(2.1, 3.2, 4.3, 5.4). Residuals (−0.1, −1.2, 0.7, −0.4). SSE=2.10, MSE=0.525, which is higher than the starting MSE of 0.5. Taylor explains it: ΔJ ≈ J_w Δw + (1/2) J_{ww}(Δw)² = (−0.5)(0.1)+(1/2)(15)(0.1)²=−0.05+0.075=+0.025."

  # ------------------------------------------------------------------ 4
  - id: c4-neuron-attention
    title: "A first neuron, and attention as a weighted sum"
    prerequisites: [c3-gradient-descent]
    objectives:
      - "Compute the pre-activation and sigmoid output of a single artificial neuron."
      - "Compute a softmax, treat it as attention weights, and form the corresponding weighted sum of values."
      - "Compute scaled dot-product attention for a query and a small set of key/value vectors."
    explanation_outline:
      - "A neuron is a linear unit plus a nonlinearity: z = w·x + b, then a = σ(z). The logistic sigmoid is σ(z)=1/(1+e^{-z}), with σ(0)=1/2, σ(z)∈(0,1), and σ(−z)=1−σ(z). Later units use ReLU, tanh and others, and stack many neurons into layers. Backpropagation (Unit 7) is just the chain rule applied to that stack."
      - "Attention is also a weighted sum, but the weights depend on the input. Given scores s_1,…,s_m, the softmax α_i = e^{s_i} / Σ_j e^{s_j} is a probability vector (nonnegative, sums to 1). The attention output is Σ_i α_i v_i, a convex combination of the values. Adding a constant to every score does not change α (a useful numerical-stability trick: subtract max s before exponentiating)."
      - "Scaled dot-product attention (Vaswani et al. 2017): for query q and keys k_i in R^d, the scores are s_i = (q·k_i)/√d. Dividing by √d keeps the dot products from growing like √d, which would drive softmax to a one-hot vector and kill the gradient. Then α=softmax(s) and the output is Σ α_i v_i. Multi-head attention, masking, positional encodings, pretraining and RLHF are Unit 9; this is the arithmetic kernel."
      - "Common errors: forgetting that sigmoid is not centred at 0 in its output (it is 0.5); normalising scores by Σ s_i instead of softmax; omitting the 1/√d scale; treating attention weights as independent sigmoids (they are coupled through the denominator)."
    explanation_prompts:
      - "Have the student compute softmax of (2,1,0) by hand, then of (12,11,10), and notice the weights are identical."
      - "Ask what happens to attention if one score is far larger than the others, and connect that to 'attention is sharp / peaked'."
    quiz:
      - id: q4.1
        difficulty: easy
        type: numeric
        prompt: "A neuron has weights w=(1, −2), bias b=0.5, and input x=(1, 1). Compute the pre-activation z = w·x + b and the sigmoid output σ(z)=1/(1+e^{-z})."
        answers:
          - {quantity: "z", value: -0.5, unit: "1", tolerance_abs: 0.005}
          - {quantity: "σ(z)", value: 0.37754, unit: "1", tolerance_pct: 1}
        hints:
          - "z = 1·1 + (−2)·1 + 0.5. Watch the sign."
          - "σ(−0.5)=1/(1+e^{0.5}). You can also use σ(−z)=1−σ(z) with σ(0.5)≈0.6225."
        solution: "z=1−2+0.5=−0.5. σ(−0.5)=1/(1+e^{0.5})=1/(1+1.648721)=1/2.648721=0.377541."
      - id: q4.2
        difficulty: medium
        type: numeric
        prompt: "Scores s=(2, 1, 0) and values v=(1, 3, 5). Compute the three softmax weights α_i and the attention output Σ α_i v_i."
        answers:
          - {quantity: "α_1", value: 0.66524, unit: "1", tolerance_pct: 1}
          - {quantity: "α_2", value: 0.24473, unit: "1", tolerance_pct: 1}
          - {quantity: "α_3", value: 0.09003, unit: "1", tolerance_pct: 1}
