conventions:
  units: "Dimensionless quantities (utilities, probabilities, losses, weights) are reported as a pure number with unit 1, or as a percent with unit %. Counts use unit count. Always state which loss you are using."
  loss: "Unless a problem says otherwise, mean squared error is MSE = (1/n) Σ_i (y_i − ŷ_i)², not the 1/(2n) variant. Gradients must match this definition."
  probability: "P(A|B) means a conditional probability. Percent and probability forms must be consistent (8.76% = 0.0876)."
  significant_figures: "Report 3-4 significant figures. Answers within ±1% (or the stated absolute tolerance) are accepted."
  linear_model: "ŷ = w x + b, with slope w and intercept b, unless a problem drops the intercept."
references:
  - "Russell & Norvig, Artificial Intelligence: A Modern Approach, 4th ed., Ch. 1–2 (agents), Ch. 3 (search), Ch. 12–13 (probability)"
